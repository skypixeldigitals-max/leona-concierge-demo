<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leona Guest Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1B4235;--forest-deep:#133026;--line:rgba(251,250,248,.14);
  --bone:#FBFAF8;--soft:rgba(251,250,248,.68);--gold:#C9A96E;
  --blue:#3F72B7;--end:#B4442E;--navy:#1A2942;--muted:#5C655F;--rule:#E2E0DC;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#0E1F19;font-family:"Montserrat",Arial,sans-serif;color:var(--bone);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:100vw;height:100dvh;background:var(--forest);overflow:hidden;display:flex;flex-direction:column;padding:28px 24px 22px}
@media (min-width:700px){.phone{width:calc(min(92vh,880px) * 9 / 19.5);height:min(92vh,880px);border-radius:40px;outline:10px solid #07120e}}

.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:9px}
.mark img{height:24px}
.mark span{font-size:10px;font-weight:600;letter-spacing:.38em;text-transform:uppercase}
.live{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);display:flex;align-items:center;gap:6px}
.live i{width:6px;height:6px;border-radius:50%;background:#7FBF93;display:inline-block}

.who{margin-top:clamp(26px,5vh,48px);text-align:center}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.portrait{margin:22px auto 0;width:clamp(120px,19vh,160px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(201,169,110,.6);display:flex;align-items:center;justify-content:center;position:relative}
.portrait::after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid var(--line)}
.portrait img{width:38%}
h1{margin-top:20px;font-family:"Playfair Display",serif;font-weight:400;font-size:clamp(28px,4.4vh,36px);letter-spacing:.06em;text-transform:uppercase}
.role{margin-top:6px;font-size:13px;color:var(--soft)}
.state{margin-top:18px;height:20px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--soft);font-variant-numeric:tabular-nums}
.meter{display:flex;gap:3px;align-items:center;height:14px}
.meter b{width:3px;height:3px;background:var(--gold);transition:height .1s ease-out}

.transcript{margin-top:clamp(16px,3vh,28px);border-top:1px solid var(--line);flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding-top:14px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 35%);mask-image:linear-gradient(to bottom,transparent 0,#000 35%)}
.t{font-size:15px;line-height:1.5}
.t small{display:block;font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;margin-bottom:2px}
.t.ai small{color:var(--gold)}
.t.user{color:var(--soft)}
.t.user small{color:var(--soft)}

.controls{margin-top:18px;display:flex;justify-content:center;align-items:center;gap:26px}
.btn{width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s ease-out,background-color .2s}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.call{background:var(--blue)}
.end{background:var(--end)}
.mute{width:52px;height:52px;background:transparent;border:1px solid var(--line)}
.mute.on{background:var(--bone)}
.mute.on svg{stroke:var(--forest)}
.foot{margin-top:14px;text-align:center;font-size:11px;color:var(--soft);min-height:16px}
.copy{margin-top:6px;text-align:center;font-size:10px;color:var(--soft);opacity:.7}

.toast{position:absolute;left:14px;right:14px;top:22px;background:var(--bone);color:var(--navy);border:1px solid var(--rule);border-radius:4px;padding:12px 14px;display:flex;gap:12px;
  transform:translateY(calc(-100% - 30px));transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:5}
.toast.show{transform:none}
.toast .ic{flex:none;width:34px;height:34px;background:var(--forest);display:flex;align-items:center;justify-content:center;border-radius:4px}
.toast .ic img{height:18px}
.toast .meta{display:flex;justify-content:space-between;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.toast b{display:block;margin-top:3px;font-size:13px;font-weight:600}
.toast p{font-size:12.5px;line-height:1.45;margin-top:2px;color:#33413B}
@media (prefers-reduced-motion:reduce){.toast,.meter b,.btn{transition:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="toast" id="toast" role="status" aria-live="polite">
    <div class="ic"><img src="leona-shield-white.png" alt=""></div>
    <div style="flex:1;min-width:0">
      <div class="meta"><span>Leona · Owner alert</span><span>Now</span></div>
      <b id="toastTitle">Alert</b>
      <p id="toastMsg"></p>
    </div>
  </div>

  <div class="top">
    <div class="mark"><img src="leona-shield-white.png" alt="Leona Properties"><span>Leona</span></div>
    <div class="live"><i></i>Guest line</div>
  </div>

  <div class="who">
    <div class="eyebrow">Seaview Villa · Mirissa</div>
    <div class="portrait" aria-hidden="true"><img src="leona-shield-white.png" alt=""></div>
    <h1>Gayan</h1>
    <div class="role">Digital concierge</div>
    <div class="state" aria-live="polite">
      <span class="meter" id="meter" hidden><b></b><b></b><b></b><b></b><b></b></span>
      <span id="status">Tap to call</span>
    </div>
  </div>

  <div class="transcript" id="transcript" aria-live="polite"></div>

  <div class="controls">
    <button class="btn mute" id="muteBtn" aria-label="Mute microphone" hidden>
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="btn call" id="callBtn" aria-label="Start call">
      <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
    </button>
  </div>
  <div class="foot" id="foot">Gayan is Leona's digital assistant</div>
  <div class="copy">&copy; 2026 Leona Properties. All rights reserved.</div>
</div>

<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.26.0/+esm";
const AGENT_ID="agent_5701m51y1fvjevardt53gjzejznv";
const NTFY_TOPIC="gedara-seaview-demo-4k9x2";
const $=id=>document.getElementById(id);
const callBtn=$("callBtn"),muteBtn=$("muteBtn"),statusEl=$("status"),meter=$("meter"),foot=$("foot"),tr=$("transcript");
const bars=[...meter.children];
const CALL_SVG=callBtn.innerHTML;
const END_SVG='<svg viewBox="0 0 24 24"><path d="M3 15c5-5 13-5 18 0l-2.5 2.5-3-1.5v-2.5a10 10 0 0 0-7 0V16l-3 1.5z"/></svg>';
let convo=null,started=0,timer=0,raf=0,mode="",muted=false;

const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function line(who,text){
  if(!text) return;
  const d=document.createElement("div");d.className="t "+who;
  d.innerHTML=`<small>${who==="ai"?"Gayan":"Guest"}</small>`;d.append(text);
  tr.append(d);while(tr.children.length>6)tr.firstElementChild.remove();
}
async function level(){
  if(!convo)return;
  try{const v=Math.max(await convo.getOutputVolume(),(await convo.getInputVolume())*.7);
    bars.forEach((b,i)=>{const k=[.5,.8,1,.8,.5][i];b.style.height=Math.max(3,Math.min(14,3+v*k*26))+"px"});}catch(e){}
  raf=requestAnimationFrame(level);
}
function render(){ if(convo&&started) statusEl.textContent=`${mode==="speaking"?"Gayan is speaking":"Listening"} · ${fmt((Date.now()-started)/1000)}`; }

async function start(){
  callBtn.disabled=true;statusEl.textContent="Connecting";foot.textContent="";
  try{
    await navigator.mediaDevices.getUserMedia({audio:true});
    convo=await Conversation.startSession({
      agentId:AGENT_ID,connectionType:"websocket",
      onConnect:()=>{started=Date.now();timer=setInterval(render,500);callBtn.className="btn end";callBtn.innerHTML=END_SVG;callBtn.setAttribute("aria-label","End call");callBtn.disabled=false;muteBtn.hidden=false;meter.hidden=false;tr.innerHTML="";level();},
      onDisconnect:(d)=>{reset();const r=String(d?.message||d?.reason||d?.closeReason||"");if(/quota|credit/i.test(r))foot.textContent="Out of ElevenLabs call credits";},
      onModeChange:({mode:m})=>{mode=m;render();},
      onMessage:m=>line((m.source==="ai"||m.role==="agent")?"ai":"user",m.message),
      onError:e=>{console.error(e);const m=String(e?.message||e||"");foot.textContent=/quota|credit/i.test(m)?"Out of ElevenLabs call credits":/not allowed/i.test(m)?"This address isn't on the agent allowlist":"Connection problem, please try again";}
    });
  }catch(e){console.error(e);foot.textContent="Microphone blocked or connection failed";reset();}
}
function reset(){
  clearInterval(timer);cancelAnimationFrame(raf);
  const dur=started?fmt((Date.now()-started)/1000):"";
  convo=null;started=0;mode="";muted=false;
  statusEl.textContent=dur?`Call ended · ${dur}`:"Tap to call";
  callBtn.className="btn call";callBtn.innerHTML=CALL_SVG;callBtn.setAttribute("aria-label","Start call");callBtn.disabled=false;
  muteBtn.hidden=true;muteBtn.classList.remove("on");meter.hidden=true;foot.textContent="Gayan is Leona's digital assistant";
}
callBtn.onclick=async()=>{if(convo){const c=convo;convo=null;await c.endSession();reset();}else start();};
muteBtn.onclick=()=>{if(!convo)return;muted=!muted;convo.setMicMuted(muted);muteBtn.classList.toggle("on",muted);muteBtn.setAttribute("aria-label",muted?"Unmute microphone":"Mute microphone");};

const toast=$("toast");let tt;
try{const es=new EventSource(`https://ntfy.sh/${NTFY_TOPIC}/sse`);
  es.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d.event!=="message")return;
    $("toastTitle").textContent=(d.title||"Owner alert").replace(/^Level\s*\d\s*[-:]\s*/i,"");$("toastMsg").textContent=d.message||"";
    toast.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("show"),6500);}catch(e){}};
}catch(e){}
</script>
</body>
</html>
